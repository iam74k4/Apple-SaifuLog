# XcodeGen 定義。`make generate`（xcodegen generate）で SaifuLog.xcodeproj を生成する。
# xcodeproj は生成物なのでコミットしない。設定はここと Config/Base.xcconfig に書く。
name: SaifuLog
options:
  bundleIdPrefix: com.iam74k4
  deploymentTarget:
    iOS: "26.0"
  # 開発言語は日本語。英語はローカライズとして足す（String Catalog の sourceLanguage も ja）。
  # 日本語と英語のどちらも優先言語に入っていない端末では、開発言語の日本語で出る（CFBundleDevelopmentRegion = ja）。
  # これは意図どおり。入力の解析が日本語の文を前提にしているので、日本語を読める人が使うアプリとして作っている
  # （英語の UI は、英語を優先する端末で日本語の入力をする人のためのもの）。理由は docs/design.md にある。
  developmentLanguage: ja
  xcodeVersion: "27.0"
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  # 画面にも端末にも依存しない純粋なロジック。swift test だけでテストできる。
  SaifuLogCore:
    path: Packages/SaifuLogCore

targets:
  # iPhone アプリ（SwiftUI + SwiftData + Foundation Models）
  SaifuLog:
    type: application
    platform: iOS
    sources:
      - path: SaifuLog
      # StoreKit の設定ファイル（課金アイテム 2 つ）。Xcode の Run で App Store の代わりに使う（下のスキームの
      # storeKitConfiguration）。アプリには入れない（buildPhase: none）。スキームから指すには、ファイルが
      # プロジェクトに載っている必要があるため、ここに置く。
      - path: Config/SaifuLog.storekit
        buildPhase: none
    dependencies:
      - package: SaifuLogCore
    # エンタイトルメント。ファイルは make generate がここの properties から書き出す（直接書き換えても消える）。
    #
    # default-data-protection: アプリが作るファイル（SwiftData の保存先 default.store と -wal / -shm を含む）の
    # 既定の保護クラスを NSFileProtectionComplete にする。家計の記録を、画面のロック中は復号できない状態にしておく。
    # 既定のクラス（初回のロック解除後は常に復号）のままだと、ロック中の端末からも読めてしまう。
    # ロック中は保存先を開けないので、ウィジェット・App Intents・バックグラウンドの処理がロック中に記録を
    # 読み書きする必要が出たら、NSFileProtectionCompleteUnlessOpen に下げるかを見直す（docs/design.md）。
    #
    # エンタイトルメントは署名ありのアーカイブにしか焼かれない。release.yml は開発用の証明書を取り込んで
    # 署名ありでアーカイブする（build.yml と make ci は署名なし）。ここに足したものが提出物に載っているかは
    # make export-ipa の照合（CI は release.yml の mode=export）で確かめる（docs/release-flow.md の
    # 「Capability（iCloud など）を足すとき」）。
    entitlements:
      path: SaifuLog/SaifuLog.entitlements
      properties:
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    # FoundationModels / SwiftData は import するだけで自動でリンクされるので、sdk: の指定は要らない。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: SaifuLog
        GENERATE_INFOPLIST_FILE: YES
        # 表示名の既定値。言語ごとの表示名は SaifuLog/Resources/InfoPlist.xcstrings が上書きする
        # （ja「サイフログ」/ en「SaifuLog」）。
        INFOPLIST_KEY_CFBundleDisplayName: サイフログ
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # 縦向きだけにする。横向きでキーボードを出すと、タイムラインがほぼ見えなくなるため。
        # iPhone のみのアプリ（TARGETED_DEVICE_FAMILY = 1）なので、iPad 用の指定は要らない。
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        # 独自の暗号化は使っていない（使うとしても OS 標準のものだけ）。宣言しておくと、
        # 提出のたびに App Store Connect で輸出規制の質問に答えずに済む。
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
        # 社内テスト用のビルド（TestFlight の社内テスト専用。release.yml の mode=testflight）だけ YES にする。
        # make archive INTERNAL_BUILD=YES がコマンドラインで上書きする（release.mk）。YES のときだけ Swift の条件
        # INTERNAL_DIAGNOSTICS が付き、診断画面（SaifuLog/Diagnostics）が入る（DEBUG のビルドにも入る）。
        # App Store へ出すビルドに入っていないことは、release.mk がアーカイブの中身で確かめる。
        # 条件をここ（アプリのターゲット）で組み立て、コマンドラインには SAIFULOG_INTERNAL_BUILD だけを渡すのは、
        # SWIFT_ACTIVE_COMPILATION_CONDITIONS をコマンドラインで渡すと、コアのパッケージを含むすべてのターゲットに掛かるため。
        SAIFULOG_INTERNAL_BUILD: NO
        SAIFULOG_INTERNAL_CONDITIONS_YES: INTERNAL_DIAGNOSTICS
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(SAIFULOG_INTERNAL_CONDITIONS_$(SAIFULOG_INTERNAL_BUILD))

  # アプリ側（SaifuLog/）のテスト。SwiftData の保存と読み込みの条件、保存の失敗の扱いなど、
  # コアに置けない（SwiftData に依存する）部分を確かめる。シミュレータで動かすので make test（swift test）とは
  # 分け、make build-tests（ビルドだけ）と make test-app（シミュレータで動かす）で回す。CI（build.yml）も同じ。
  SaifuLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SaifuLogTests
      # 購入のテスト（SKTestSession）が読む StoreKit の設定ファイル。テストのバンドルにだけ入れる（アプリには入れない）。
      - path: Config/SaifuLog.storekit
        buildPhase: resources
    dependencies:
      - target: SaifuLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).Tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SaifuLog:
    build:
      targets:
        SaifuLog: all
    run:
      config: Debug
      # Xcode の Run（手元の実行）だけ、App Store の代わりに StoreKit の設定ファイルで購入を試す（価格や購入の成功・
      # 失敗・承認待ち・返金を、Xcode の Debug → StoreKit → Manage Transactions で操作できる）。Test・Archive には
      # 効かない（提出物は本物の App Store とつながる。テストは SKTestSession で同じファイルを読む）。
      storeKitConfiguration: Config/SaifuLog.storekit
    test:
      # アプリのテストは日本語の文で期待値を書いているので、テストを動かすときの言語と地域を日本語に固定する。
      # 固定しないとシミュレータの言語に左右され、手元（Mac が日本語）では通り、CI のランナー（英語）では英語の訳が
      # 返って落ちる。英語の訳は、LocalizationTests などで en.lproj を直接読んで確かめる（make check-strings も）。
      language: ja
      region: JP
      targets:
        - package: SaifuLogCore/SaifuLogCoreTests
        - SaifuLogTests
    archive:
      config: Release
