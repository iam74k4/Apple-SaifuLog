name: tag-release

# 配信が始まった版に、タグと GitHub Release で印を付ける。
#
# 定期的に App Store Connect を見て、main のバージョンが配信中（READY_FOR_SALE /
# READY_FOR_DISTRIBUTION）になっていて、まだタグが無ければ打つ。審査の所要時間は
# 読めないので、「終わったら人が実行する」ではなく「終わったのを見つけたら勝手に打つ」形にする。
# タグはあるのに GitHub Release が無い（前回の実行が途中で落ちた）ときは、Release だけを作る。
#
# アップロードの時点でタグを打たないのは、リジェクトされた場合に「タグはあるのに
# 世に出ていない」版を残さないため。release.yml はタグの有無で「配信済みか」を
# 判定しているので、先に打つとリジェクト後の出し直しもスキップされてしまう。
#
# 注意: cron はこのリポジトリの既定ブランチ（main）にあるファイルで動く。
# このワークフローを直したら main に入るまで反映されない（develop へマージ
# しただけでは、次のリリースで main に入るまで古い定義のまま動く）。

on:
  schedule:
    # 3 時間おき。審査の結果は分単位で追う必要が無い。
    # 分をずらしているのは、毎時 0 分に集まる混雑を避けるため。
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "App Store の状態を見ずにタグを打つ"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  ASC_BUNDLE_ID: com.iam74k4.SaifuLog

jobs:
  tag:
    # Xcode は要らない（API を叩いてタグを打つだけ）。版は固定して、イメージの更新で
    # 挙動が変わらないようにする。
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 配信状況の確認に release.yml と同じ API キーを使う。
    #
    # 注意: この Environment に「Required reviewers」を付けると、3 時間おきの
    # cron が毎回この承認待ちで止まる（多くは何もせず終わる実行なので、承認の
    # 通知だけが溜まる）。鍵の保護は Required reviewers ではなく、配備ブランチを
    # main に限る設定で行う。
    environment: release

    steps:
      - uses: actions/checkout@v7
        with:
          # 見るのは常に main の中身。手動実行を別のブランチから掛けても
          # 判定がぶれないよう明示する。
          ref: main
          fetch-depth: 0

      - name: 打つべきタグと GitHub Release があるか調べる
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ubuntu には PlistBuddy も xcodebuild も無いので、Config/Base.xcconfig を
          # sed / grep で読む。読み方は scripts/check-version.sh（POSIX sh）の 1 か所に
          # 寄せていて、build.yml / release.yml と同じ値になる。
          VERSION=$(./scripts/check-version.sh --print)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # 「済み」はタグではなく GitHub Release の有無で決める。タグの push の後で
          # gh release create が落ちる（API の一時的なエラーなど）と、タグだけが残る。タグの有無で
          # 決めると、以降の実行がすべて「済み」で終わり、Release がいつまでも作られない。
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "todo=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION のタグと GitHub Release は既にあります。何もしません。"
          elif git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            # タグは配信を確かめてから打っている（または force で人が打たせた）ので、
            # 配信状況は見直さずに Release だけを作る。
            echo "todo=true" >> "$GITHUB_OUTPUT"
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION のタグはありますが、GitHub Release がありません。Release だけを作ります。"
          else
            echo "todo=true" >> "$GITHUB_OUTPUT"
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION のタグがまだありません。配信状況を確認します。"
          fi

      - uses: actions/setup-python@v7
        if: steps.check.outputs.todo == 'true' && steps.check.outputs.tagged != 'true' && !inputs.force
        with:
          python-version: "3.12"

      - name: 配信が始まっているか確認する
        id: live
        if: steps.check.outputs.todo == 'true' && steps.check.outputs.tagged != 'true' && !inputs.force
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          pip install --quiet "pyjwt[crypto]>=2.8,<3"
          # 配信前なら終了コード 2。App Store Connect に版がまだ無い（提出前。main へのマージ直後や、
          # 初回に ASC_AUTO_SUBMIT=false で手で提出するまで）ときも 2 になる。
          # 審査待ちや提出待ちは失敗ではないので、ここでは落とさない。
          set +e
          STATE=$(python3 scripts/asc.py state --version "$VERSION" --require-live)
          CODE=$?
          set -e
          echo "state=$STATE"
          if [ "$CODE" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" -eq 2 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "まだ配信前です。次の実行でまた見ます。"
          else
            exit "$CODE"
          fi

      - name: タグと GitHub Release を作る
        if: >-
          steps.check.outputs.todo == 'true' &&
          (inputs.force || steps.check.outputs.tagged == 'true' || steps.live.outputs.ready == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          TAG="v$VERSION"
          # CHANGELOG の該当節をそのままリリースノートにする。GitHub は Markdown を
          # 表示できるので、App Store 向けの --plain は付けない。
          ./scripts/changelog-section.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::warning::CHANGELOG.md に [$VERSION] の節が見つかりません。ノート無しで作ります。"
          fi

          # 前回の実行がタグの push の後（Release の作成）で落ちていたら、タグはもうある。
          # 打ち直さずに、Release だけを作る。
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG のタグは既にあります。GitHub Release だけを作ります。"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "SaifuLog $TAG"
            git push origin "$TAG"
          fi
          # --verify-tag: リモートにタグが無ければ作らずに止める。gh が別のコミットに
          # 軽量タグを作ってしまうのを防ぐため。
          gh release create "$TAG" --verify-tag --title "SaifuLog $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          echo "作成: $TAG"
