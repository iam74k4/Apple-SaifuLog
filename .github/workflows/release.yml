name: release

# main へのマージで、App Store 提出用のアーカイブを作り、App Store Connect へ
# アップロードして、そのまま審査に出すところまでを自動で進める。
#
#   upload  … 開発用の証明書を一時キーチェーンに取り込んで署名ありのアーカイブを作り、クラウド署名で
#             書き出して App Store Connect へ送る（macOS ランナー）。送る前に、送らずに書き出して署名と
#             エンタイトルメントを確かめる（エンタイトルメントの抜けは、main で mode=export の照合が
#             通るのを確かめるまでは警告だけ）
#   submit  … 処理の終了を待ち、バージョンにビルドを紐づけ、審査に出す（Linux）
#
# 手動実行の mode=testflight は、develop（Environment の配備ブランチが許すブランチ）のビルドを実機で確かめるためのもの。
# 診断画面入り（make archive INTERNAL_BUILD=YES）でアーカイブし、TestFlight の社内テスト専用
# （testFlightInternalTestingOnly）として送るだけで、submit は走らない。社内テスト専用のビルドは、Apple が審査にも
# 外部テストにも出させない。
#
# 配信が始まったあとのタグ打ちは tag-release.yml が引き取る。
# 必要な Secrets と一度だけの準備は docs/release-flow.md にまとめてある。未設定のまま
# main へマージすると、API キーの書き出しか証明書の取り込みの段階で落ちる（プロダクトには影響しない）。

on:
  push:
    branches: [main]
  # Secrets を直した後の再実行や、疎通確認、develop のビルドを TestFlight で試すために手でも回せるようにする。
  # 走らせられるのは、Environment（release）の配備ブランチが許すブランチ（main と develop）だけ。そのうえで、
  # App Store へ出せるビルドを送る mode（submit / upload）は main からだけにする（upload ジョブの「出す版かどうかを判定」
  # で止め、submit ジョブも if で main に限る）。develop から送れるのは、審査に出せない社内テスト専用のビルドだけ。
  workflow_dispatch:
    inputs:
      mode:
        description: "どこまでやるか（submit: 審査に出すまで / upload: アップロードまで / export: 書き出すだけで送信しない / testflight: 診断画面入りで TestFlight の社内テストへ送るだけ。develop から選ぶ）"
        type: choice
        options: [submit, upload, export, testflight]
        default: submit

# アップロードを途中で打ち切ると App Store Connect に処理中のビルドが残るため、
# 後続を待たせる（cancel はしない）。
# queue: max にするのは、待っている実行を後から来た実行に置き換えさせないため。既定
# （queue: single）では待機は 1 つまでで、main への push の実行が待っているところへ手で
# 実行（mode=export など）を掛けると、push の実行が取り消されて、そのマージが提出されない。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

env:
  ASC_BUNDLE_ID: com.iam74k4.SaifuLog

jobs:
  upload:
    # build.yml と同じイメージ。理由はそちらのコメントを参照。
    runs-on: xcode-27
    timeout-minutes: 60
    # App Store Connect の API キーは Environment（release）の Secrets に置く。
    # リポジトリ Secrets だと、どのブランチのどのワークフローからも読めてしまう。
    # Environment 側で配備ブランチを main と develop に限り、鍵に触れるのを保護ルール（Ruleset で直接 push できず、
    # PR と build が必須）の掛かったブランチのコードだけにする。審査に出すのを main に限っているのは Environment ではなく
    # このファイルの条件（下の「出す版かどうかを判定」と submit ジョブの if）で、その条件を develop で外されないことは
    # develop の Ruleset に頼っている（docs/release-flow.md の「一度だけの準備」の 3）。
    environment: release
    env:
      # push のときは inputs が空なので、ふだんのリリース（submit）として扱う。
      MODE: ${{ inputs.mode || 'submit' }}
      # 診断画面を入れるか（release.mk の INTERNAL_BUILD）。mode=testflight のときだけ YES にする。main への push と
      # ほかの mode は必ず NO。release.mk がアーカイブの中身と照らし合わせ、食い違えばアーカイブとアップロードの前で止まる。
      INTERNAL_BUILD: ${{ inputs.mode == 'testflight' && 'YES' || 'NO' }}
      # 以下 3 つは build.yml と同じ値にする。CI で通ったものと提出物を同じ道具で作るため。
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      XCODEGEN_VERSION: "2.46.0"
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.archive.outputs.build }}
      uploaded: ${{ steps.upload.outputs.uploaded }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 「この版はもう出したか」をタグの有無で判定するため、履歴とタグが全部要る。
          fetch-depth: 0

      # 進めるかどうかは GO（GITHUB_ENV）で後続へ渡す。ここで決め、App Store Connect の
      # 状態を見たところ（下の「承認済みの版でないか確かめる」）で取り消すことがある。
      - name: 出す版かどうかを判定
        id: plan
        run: |
          # バージョンの読み方は scripts/check-version.sh の 1 か所に寄せている。
          VERSION=$(./scripts/check-version.sh --print)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # App Store へ出せるビルド（審査に出せる形）を送るのは main からだけ。Environment（release）の配備ブランチに
          # develop を足したのは mode=testflight のためで、develop のビルドを審査に出せる形で送らせないため。
          case "$MODE" in
            submit | upload)
              if [ "$GITHUB_REF" != refs/heads/main ]; then
                echo "::error::mode=${MODE} は main からだけ走らせられます（いま: ${GITHUB_REF_NAME}）。develop のビルドを実機で確かめるなら mode=testflight を選んでください。"
                exit 1
              fi ;;
          esac
          if [ "$MODE" = export ]; then
            # 書き出すだけなら App Store Connect に何も残らないので、配信済みの版でも走らせてよい。
            echo "GO=true" >> "$GITHUB_ENV"
            echo "v$VERSION を書き出すだけにします（送信しません）。"
          elif [ "$MODE" = testflight ]; then
            # testflight はタグがあってもスキップしない（二重に出す心配が無い。社内テスト専用のビルドは審査に出せず、
            # 同じ版のビルドが TestFlight に増えるだけで、番号は実行ごとに増える）。ただし、タグがある版は配信済みで、
            # Apple はその版の新しいビルドを TestFlight にも受け付けない（承認された版は閉じる）。20 分かけて
            # アーカイブしてからアップロードで弾かれるより、ここで理由と直し方を出して止める。
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "::error::v${VERSION} は配信済み（タグあり）で、Apple はこの版の新しいビルドを TestFlight にも受け付けません。作業ブランチで MARKETING_VERSION（Config/Base.xcconfig）と CHANGELOG.md の先頭の見出しを次の版に上げて develop へ入れてから、もう一度走らせてください。"
              exit 1
            fi
            echo "GO=true" >> "$GITHUB_ENV"
            echo "v$VERSION を TestFlight の社内テスト専用で送ります（診断画面入り。審査には出しません。ブランチ: ${GITHUB_REF_NAME}）。"
          elif git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            # タグがある = 配信済みの版。バージョンを上げずに main へマージした
            # （ドキュメント修正など）だけなので、アップロードしない。
            echo "GO=false" >> "$GITHUB_ENV"
            echo "v$VERSION は配信済み（タグあり）。アップロードをスキップします。"
          else
            echo "GO=true" >> "$GITHUB_ENV"
            echo "v$VERSION をアップロードします（mode=${MODE}）。"
          fi

      - name: ツールチェーンを表示
        if: env.GO == 'true'
        run: |
          if [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::$DEVELOPER_DIR がありません。ランナーのイメージが変わった可能性があります。"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"

      # build.yml と同じ手順。理由はそちらのコメントを参照。
      - name: XcodeGen を入れる
        if: env.GO == 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version

      # xcodebuild の -authenticationKeyPath はファイルのパスしか受け付けないので、
      # Secret の中身をランナーの一時ディレクトリに書き出す。配布用の証明書は要らない
      # （App Store 向けの署名は export の段階でクラウド管理の配布証明書が使われる）。
      # アーカイブの署名に使う開発用の証明書は、下の「署名の証明書を一時キーチェーンに取り込む」で入れる。
      # ファイル名にキー ID（Secret）を入れないのは、パスを GITHUB_ENV で後続の
      # ステップへ渡すため。Secret を含む値を広げる範囲は小さくしておく。
      - name: API キーを一時ファイルに書き出す
        if: env.GO == 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_API_KEY_ID" ] || [ -z "$ASC_API_ISSUER_ID" ] || [ -z "$ASC_API_KEY_P8" ]; then
            echo "::error::Environment「release」の Secrets（ASC_API_KEY_ID / ASC_API_ISSUER_ID / ASC_API_KEY_P8）が足りません。docs/release-flow.md を参照してください。"
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/asc_api_key.p8"
          (umask 077 && printf '%s\n' "$ASC_API_KEY_P8" > "$KEY_PATH")
          echo "ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # 承認から tag-release がタグを打つまで（最大 3 時間。ASC_RELEASE_TYPE=MANUAL なら配信を
      # 押すまで）の間は、タグが無くても、その版にはもう新しいビルドを送れない（Apple が
      # アップロードを弾く）。その間に版を上げずに main へマージすると、タグが付いたあとと
      # 同じく出すものは無いのに、アップロードが赤で落ちる。App Store Connect の状態を見て、
      # 承認済み以降ならアップロードせずに終える。版がまだ無い（これから作る）ときや、
      # 審査待ち・審査中はそのまま進む（審査中なら submit ジョブが差し替えずに止まる）。
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: env.GO == 'true' && env.MODE != 'export'
        with:
          python-version: "3.12"

      - name: 承認済みの版でないか確かめる
        if: env.GO == 'true' && env.MODE != 'export'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          # 版とハッシュで固定した依存だけを入れる。理由は submit ジョブの「依存を入れる」を参照。
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r scripts/requirements.txt
          # .p8 は上で書き出した ASC_API_KEY_PATH から読む。
          set +e
          STATE=$(python3 scripts/asc.py state --version "$VERSION" --require-open)
          CODE=$?
          set -e
          echo "state=$STATE"
          if [ "$CODE" -eq 2 ] && [ "$MODE" = testflight ]; then
            # 承認済み以降の版は、TestFlight の社内テスト用のビルドも受け付けない。頼まれて送る実行なので、
            # 黙ってスキップせずに止める（届かないビルドを待たせない）。
            echo "::error::v${VERSION} は承認済み（${STATE}）で、Apple はこの版の新しいビルドを TestFlight にも受け付けません。作業ブランチで MARKETING_VERSION と CHANGELOG.md の先頭の見出しを次の版に上げて develop へ入れてから、もう一度走らせてください。"
            exit 1
          elif [ "$CODE" -eq 2 ]; then
            echo "GO=false" >> "$GITHUB_ENV"
            echo "::notice::v${VERSION} は承認済み（${STATE}）で、タグが付くのを待っています。この版にはもうビルドを送れないので、アップロードをスキップします（タグは tag-release が付けます）。"
          elif [ "$CODE" -ne 0 ]; then
            exit "$CODE"
          fi

      # アーカイブを開発用の証明書（Apple Development）で署名するために、Secrets の .p12 を使い捨ての
      # キーチェーンに取り込む。署名なしのアーカイブにはエンタイトルメント（データ保護など）が焼かれず、
      # export の段階の署名し直し（クラウド署名）もアーカイブにあるものしか引き継がないため。
      #
      # 証明書を Secrets で固定して渡すのは、使い捨てのランナーで自動署名に任せきりにすると、実行のたびに
      # 開発用の証明書が新しく作られ、秘密鍵はランナーと一緒に消えるため（release.mk の ARCHIVE_SIGNING）。
      # プロファイルは、アーカイブの段階で -allowProvisioningUpdates と API キーで Xcode が用意する
      # （開発用のプロファイルなので、チームに登録した端末が 1 台以上要る）。
      # 取り込みは security コマンドで直に行う。証明書を取り込むサードパーティの action は使わない
      # （使える actions を GitHub 製に限っている。docs/release-flow.md の「一度だけの準備」の 7）。
      #
      # Secrets が無ければ止める。署名なしに切り替えて続けることはしない。アップロード前の照合はまだ
      # 警告だけ（RELEASE_ENTITLEMENTS_CHECK=warn）なので、署名なしに落とすと、データ保護の抜けたビルドが
      # 警告 1 つで審査まで進んでしまう。mode=export も同じ扱いにする（署名ありのアーカイブで照合が通るかを
      # 確かめるための実行なので、署名なしで走らせても意味がない）。
      #
      # 証明書の名前（Apple Development: 氏名）は、ここでは出さない。公開リポジトリの Actions のログは誰でも
      # 読めるため（xcodebuild はアーカイブのログの署名の行に名前を出すので、それは避けられない）。
      - name: 署名の証明書を一時キーチェーンに取り込む
        if: env.GO == 'true'
        env:
          APPLE_DEV_CERT_P12_BASE64: ${{ secrets.APPLE_DEV_CERT_P12_BASE64 }}
          APPLE_DEV_CERT_P12_PASSWORD: ${{ secrets.APPLE_DEV_CERT_P12_PASSWORD }}
        run: |
          if [ -z "$APPLE_DEV_CERT_P12_BASE64" ] || [ -z "$APPLE_DEV_CERT_P12_PASSWORD" ]; then
            echo "::error::Environment「release」の Secrets（APPLE_DEV_CERT_P12_BASE64 / APPLE_DEV_CERT_P12_PASSWORD）が足りません。アーカイブの署名に使う Apple Development の証明書（.p12）とそのパスワードです。docs/release-flow.md の「署名ありのアーカイブ」を参照してください。"
            exit 1
          fi

          # パスは「後片付け（鍵を残さない）」と揃える。あちらは GITHUB_ENV に頼らず、同じ名前で消す
          # （このステップが途中で落ちても消せるように）。
          P12_PATH="$RUNNER_TEMP/apple_dev_cert.p12"
          PEM_PATH="$RUNNER_TEMP/apple_dev_cert.pem"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          # 秘密鍵の入った .p12 は、取り込みが済んだら（途中で落ちても）このステップのうちに消す。
          trap 'rm -f "$P12_PATH" "$PEM_PATH"' EXIT

          # 貼り付けたときに改行や空白が混ざっても読めるように、落としてから戻す。
          if ! (umask 077 && printf '%s' "$APPLE_DEV_CERT_P12_BASE64" | tr -d '[:space:]' | base64 --decode > "$P12_PATH") 2>/dev/null \
              || [ ! -s "$P12_PATH" ]; then
            echo "::error::APPLE_DEV_CERT_P12_BASE64 を base64 として読めません。.p12 を「base64 -i <ファイル>」で変換した出力をそのまま入れてください（docs/release-flow.md の「署名ありのアーカイブ」）。"
            exit 1
          fi

          # 同じランナーで走り直したとき（セルフホストに移した場合）に前のキーチェーンが残っていても、作り直せるようにする。
          security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
          # キーチェーンのパスワードは、この実行の中だけで使う使い捨ての値（どこにも保存しない）。
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # ジョブの上限（60 分）より長くしておき、アーカイブの途中でロックされて署名が止まらないようにする。
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          if ! security import "$P12_PATH" -k "$KEYCHAIN_PATH" -f pkcs12 -P "$APPLE_DEV_CERT_P12_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security; then
            echo "::error::.p12 を取り込めません。APPLE_DEV_CERT_P12_PASSWORD が書き出したときのパスワードと合っているか、.p12 をキーチェーンアクセスか Xcode で書き出したか（openssl で作ると macOS の読めない形式になることがある）を確かめてください。"
            exit 1
          fi
          rm -f "$P12_PATH"
          # codesign が確認のダイアログ（CI では誰も押せない）を出さずに秘密鍵を使えるようにする。
          # 出力には鍵の名前（証明書の名前）が並ぶので捨てる。
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          # 中身を確かめる。取り違えた証明書のまま進むと、xcodebuild は使える証明書が無いとみなして
          # API キーの権限で開発用の証明書を新しく作りにいき（上の理由で溜まる）、原因の分かりにくい
          # エラーになる。
          if ! security find-identity -p codesigning "$KEYCHAIN_PATH" | grep -q '"Apple Development: '; then
            echo "::error::.p12 に Apple Development の証明書と秘密鍵が入っていません。Apple Distribution など別の種類の証明書や、秘密鍵を含まない書き出しになっていないかを確かめてください（docs/release-flow.md の「署名ありのアーカイブ」）。"
            exit 1
          fi
          security find-certificate -c "Apple Development: " -p "$KEYCHAIN_PATH" > "$PEM_PATH"
          # チームは Config/Base.xcconfig の DEVELOPMENT_TEAM（アーカイブの署名に使う値）と比べる。
          # 証明書のチームは subject の OU にある。subject の全体は名前を含むので出さない。
          TEAM=$(sed -n 's/^[[:space:]]*DEVELOPMENT_TEAM[[:space:]]*=[[:space:]]*\([A-Z0-9]*\).*/\1/p' Config/Base.xcconfig)
          CERT_TEAM=$(openssl x509 -in "$PEM_PATH" -noout -subject | sed -n 's/.*OU[[:space:]]*=[[:space:]]*\([A-Z0-9]\{10\}\).*/\1/p')
          if [ -z "$TEAM" ] || [ "$CERT_TEAM" != "$TEAM" ]; then
            echo "::error::証明書のチーム（${CERT_TEAM:-読み取れない}）が Config/Base.xcconfig の DEVELOPMENT_TEAM（${TEAM:-読み取れない}）と違います。このチームの Apple Development の証明書を書き出してください。"
            exit 1
          fi
          EXPIRES=$(openssl x509 -in "$PEM_PATH" -noout -enddate | sed 's/^notAfter=//')
          if ! openssl x509 -in "$PEM_PATH" -noout -checkend 0 >/dev/null; then
            echo "::error::Apple Development の証明書の期限が切れています（${EXPIRES}）。新しい証明書を書き出して Secrets を差し替えてください（docs/release-flow.md の「年に一度の更新」）。"
            exit 1
          fi
          # 期限は 1 年。切れてから気づくとリリースがそこで止まるので、30 日前から警告を出す。
          if ! openssl x509 -in "$PEM_PATH" -noout -checkend 2592000 >/dev/null; then
            echo "::warning::Apple Development の証明書の期限が 30 日を切りました（${EXPIRES}）。新しい証明書を書き出して Secrets を差し替えてください（docs/release-flow.md の「年に一度の更新」）。"
          fi
          # 期限のほかに、失効や中間証明書（Apple WWDR）の欠けでも有効と判定されない。判定はランナーの
          # 信頼の設定にも左右されるので、ここでは止めずに警告だけ出し、成否はアーカイブの署名に任せる
          # （落ちたときの手がかりとして残す）。
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q '"Apple Development: '; then
            echo "::warning::取り込んだ Apple Development の証明書が、有効な署名用の証明書と判定されませんでした（失効している、または中間証明書が無い）。アーカイブの署名で落ちたら、Certificates, Identifiers & Profiles でこの証明書が有効かを確かめてください。"
          fi

          # xcodebuild（自動署名）は、キーチェーンの検索リストから証明書を探す。いまのリスト
          # （ログインキーチェーンなど）は残したまま、先頭に足す。
          KEYCHAINS=()
          while IFS= read -r line; do
            line=$(printf '%s' "$line" | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')
            if [ -n "$line" ]; then KEYCHAINS+=("$line"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${KEYCHAINS[@]}"

          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "署名の証明書を取り込みました（期限: ${EXPIRES}）。"

      # ビルド番号（CFBundleVersion）は「同じ版の中で、前に送ったものより必ず大きい」ことが
      # 求められる。重複すると App Store Connect がアップロードを弾く。
      #
      # Config/Base.xcconfig の CURRENT_PROJECT_VERSION を人が上げる方式だと、上げ忘れや、
      # 同じ版を出し直したとき（リジェクト後など）に衝突する。そこで、このワークフローの
      # 実行番号から機械的に作る。run_number は release.yml の実行ごとに 1 ずつ増え、
      # 戻らない。失敗したジョブを「Re-run」すると run_number は同じまま run_attempt だけが
      # 増えるので、それも混ぜる（アップロードまで済んでから落ちた実行を再実行しても、
      # 番号がぶつからない）。
      #   例: 12 回目の実行の 1 回目 → 1201、再実行 → 1202、13 回目 → 1301
      # 同じ実行を 99 回まで再実行しても、次の実行の番号とは重ならない。
      #
      # release.yml の名前を変えると run_number は 1 からやり直しになる。そのときや、
      # 手元から大きい番号で送ってしまったときは、リポジトリ変数 BUILD_NUMBER_OFFSET で
      # 底上げする（docs/release-flow.md）。
      #
      # tag-release.yml は、配信されたビルドの番号からこの式を逆にたどって実行を見つけ、
      # その実行のコミットにタグを打つ。式を変えるときは tag-release.yml も一緒に直す。
      # 配信待ちの版があるうちに BUILD_NUMBER_OFFSET を変えると逆算がずれる（tag-release は
      # 版が合わずに止まるので、手動実行の sha でコミットを指定する）。
      #
      # mode=testflight もこの式で番号を付ける（TestFlight 用に別のワークフローを作らない）。社内テスト用のビルドも、
      # App Store へ出すビルドと同じ版（MARKETING_VERSION）の中で番号の重複を許されない。別のワークフローにすると
      # run_number が 1 から別々に数えられ、同じ版の中で番号がぶつかる。同じ release.yml の実行番号を分け合えば、
      # mode にかかわらず、番号は実行ごとに必ず増える（testflight の実行の後の main の実行は、それより大きい番号になる）。
      # testflight の実行が tag-release.yml の逆算に紛れることはない。逆算するのは App Store で配信中の版に紐づいた
      # ビルドの番号だけで、社内テスト専用のビルドは版に紐づけられない（審査に出せない）ため。
      - name: アーカイブを作る
        id: archive
        if: env.GO == 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET || '0' }}
        run: |
          # 先頭の 0 を許すと、シェルの算術式が 8 進数として読む（010 → 8）。
          case "$BUILD_NUMBER_OFFSET" in
            '' | *[!0-9]* | 0?*)
              echo "::error::リポジトリ変数 BUILD_NUMBER_OFFSET は 0 以上の整数（先頭に 0 を付けない）にしてください（いま: ${BUILD_NUMBER_OFFSET}）。"
              exit 1 ;;
          esac
          BUILD_NUMBER=$(( BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT ))
          echo "ビルド番号: $BUILD_NUMBER"

          # 開発用の証明書で署名する（ARCHIVE_SIGNING=YES）。証明書は上で取り込んだキーチェーンから使い、
          # プロファイルは -allowProvisioningUpdates と API キーで Xcode が用意する（release.mk）。
          # キーチェーンが無いまま YES で走らせると、xcodebuild が API キーの権限で開発用の証明書を
          # 新しく作ってしまう（release.mk の ARCHIVE_SIGNING）。ステップの並びを変えたときのために止める。
          if [ -z "$SIGNING_KEYCHAIN_PATH" ]; then
            echo "::error::署名のキーチェーンがありません（「署名の証明書を一時キーチェーンに取り込む」が先に走っていない）。"
            exit 1
          fi
          # INTERNAL_BUILD は mode=testflight のときだけ YES（job の env）。release.mk が、できたアプリに診断画面が
          # そのとおりに入っているか（入っていないか）を確かめる。
          make archive ARCHIVE_SIGNING=YES ARCHIVE_KEYCHAIN="$SIGNING_KEYCHAIN_PATH" BUILD_NUMBER="$BUILD_NUMBER" INTERNAL_BUILD="$INTERNAL_BUILD"

          # 後続（asc.py wait-build）へは、計算した値ではなく、できあがったアーカイブの
          # 値を渡す。二か所で同じ式を持つと、片方だけずれたときに処理待ちが空振りする。
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :ApplicationProperties:CFBundleVersion" build/SaifuLog.xcarchive/Info.plist)
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

      # 送る前に、送らずに書き出して確かめる。App Store Connect には何も残らない。署名の経路
      # （クラウド署名）の確認を兼ね、書き出したアプリをエンタイトルメントのファイルと照合する（release.mk）。
      #
      # 照合は、いまは警告だけにする（RELEASE_ENTITLEMENTS_CHECK=warn）。アーカイブは署名あり（上の
      # 「署名の証明書を一時キーチェーンに取り込む」と ARCHIVE_SIGNING=YES）にしたので、データ保護
      # （default-data-protection）は載るはずだが、この経路はまだ一度も通していない。経路のどこかが
      # 食い違っていたときに止めると、develop → main をマージするたびにリリースが止まる。抜けは run の
      # Annotations に警告として残る。所有者が main で mode=export を走らせ、照合が通る（下の「書き出す
      # だけ」は止める扱い）ことを確かめたら、warn を外して止まるようにする（docs/release-flow.md の
      # 「署名ありのアーカイブ」）。
      - name: 送る前に書き出して確かめる（送信しない）
        if: env.GO == 'true' && env.MODE != 'export'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: make export-ipa RELEASE_ENTITLEMENTS_CHECK=warn INTERNAL_BUILD="$INTERNAL_BUILD"

      # exportArchive の destination=upload（Config/ExportOptions.plist）で、書き出しと
      # 送信を 1 回で行う。altool は非推奨が続いているので使わない。
      # mode=testflight（INTERNAL_BUILD=YES）は、release.mk が testFlightInternalTestingOnly を true にした写しで送る。
      - name: App Store Connect へアップロード
        id: upload
        if: env.GO == 'true' && env.MODE != 'export'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          BUILD: ${{ steps.archive.outputs.build }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          make upload INTERNAL_BUILD="$INTERNAL_BUILD"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
          echo "アップロード完了（ビルド ${BUILD}）。"
          if [ "$MODE" = testflight ]; then
            echo "::notice::v${VERSION}（ビルド ${BUILD}）を TestFlight の社内テスト専用で送りました。App Store Connect の処理（10 分〜1 時間）が終わると、iPhone の TestFlight アプリから入れられます（docs/release-flow.md の「TestFlight で実機に入れる（社内テスト）」）。"
            {
              echo "### TestFlight（社内テスト専用）"
              echo ""
              echo "- 版 ${VERSION}、ビルド ${BUILD}（診断画面入り。ブランチ ${GITHUB_REF_NAME}）"
              echo "- 審査には出していません（社内テスト専用のビルドは審査にも外部テストにも出せません）"
              echo "- App Store Connect の処理が終わると、TestFlight アプリに現れます"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # 疎通確認用。送信せずに .ipa を書き出し、署名とエンタイトルメントをログに出す。
      # こちらはエンタイトルメントの照合を止める扱い（既定の error）のままにする。署名ありのアーカイブで
      # 照合が通るかを、この実行の成否で確かめるため。
      # 書き出した .ipa はアーティファクトにしない。リポジトリが公開なので、
      # 審査前のアプリを誰でも落とせる状態になるため。
      - name: 書き出すだけ（送信しない）
        if: env.GO == 'true' && env.MODE == 'export'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: make export-ipa INTERNAL_BUILD="$INTERNAL_BUILD"

      # GitHub のランナーはジョブごとに捨てられるが、鍵を置きっぱなしにしない習慣として消す
      # （セルフホストに移したときにも、そのまま安全なように）。成否や取り消しにかかわらず走らせる（always()）。
      # パスは「API キーを一時ファイルに書き出す」「署名の証明書を一時キーチェーンに取り込む」と揃える。
      # GITHUB_ENV に頼らないのは、それらのステップが書き込む前に落ちても消せるようにするため。
      - name: 後片付け（鍵を残さない）
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc_api_key.p8" "$RUNNER_TEMP/apple_dev_cert.p12" "$RUNNER_TEMP/apple_dev_cert.pem"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          if [ -e "$KEYCHAIN_PATH" ]; then
            # delete-keychain は、キーチェーンの検索リストからも外す。
            if ! security delete-keychain "$KEYCHAIN_PATH"; then
              echo "::warning::一時キーチェーンを security で消せなかったので、ファイルを直接消します。"
              rm -f "$KEYCHAIN_PATH"
            fi
          fi

  # ビルドの処理待ちは 10 分から 1 時間かかる。Xcode の要らないここは Linux で待つ
  # （macOS ランナーの枠を長く塞がない）。
  submit:
    needs: upload
    # 審査に出すのは、main の実行で次のどちらかのとき。
    #   - main への push（ふだんのリリース）。リポジトリ変数 ASC_AUTO_SUBMIT が 'false' なら出さない
    #   - 手動実行で mode=submit を選んだとき。明示的な指示なので ASC_AUTO_SUBMIT は見ない
    #     （ASC_AUTO_SUBMIT=false で上げた初回のビルドを確かめたあと、手で出すため）
    # main 以外（develop など）の実行からは審査に出さない（github.ref で明示する）。Environment（release）の配備
    # ブランチに develop を足したので、Environment の設定だけでは main に絞れなくなったため。この条件は走らせる
    # ブランチ側のこのファイルにあるので、develop で外されないことは develop の Ruleset に頼っている。mode=testflight は
    # 下の条件のどれにも当たらず、このジョブは走らない（社内テスト専用のビルドは、そもそも審査に出せない）。
    # ここ（job の if）は Environment を解決する前に評価されるので、vars はリポジトリの
    # Variables しか読めない。ASC_AUTO_SUBMIT を Environment 側に置くと効かない。
    if: >-
      needs.upload.outputs.uploaded == 'true' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.ASC_AUTO_SUBMIT != 'false') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'submit'))
    runs-on: ubuntu-24.04
    # upload と同じ API キーを使う。
    environment: release
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # 版とハッシュで固定した依存だけを入れる（scripts/requirements.in）。Admin 権限の鍵を
      # 持つジョブで、PyPI のその日の最新をそのまま実行しないため。ソースからのビルド
      # （setup.py などを実行する）も許さない。
      - name: 依存を入れる
        run: |
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r scripts/requirements.txt

      # 前のジョブの出力や変数は、run の中に式で直接埋め込まず env を通して渡す。
      # 埋め込むとシェルの文として解釈され、値によってはコマンドとして実行されうるため。
      - name: ビルドの処理が終わるのを待つ
        id: build
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          VERSION: ${{ needs.upload.outputs.version }}
          BUILD: ${{ needs.upload.outputs.build }}
        run: |
          BUILD_ID=$(python3 scripts/asc.py wait-build --version "$VERSION" --build "$BUILD")
          echo "id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      # App Store は Markdown を表示しないので --plain（小見出しの ### などを外す）。
      - name: リリースノートを CHANGELOG から取り出す
        env:
          VERSION: ${{ needs.upload.outputs.version }}
        run: |
          ./scripts/changelog-section.sh --plain "$VERSION" > "$RUNNER_TEMP/notes.txt"
          if [ ! -s "$RUNNER_TEMP/notes.txt" ]; then
            echo "::warning::CHANGELOG.md に [$VERSION] の節がありません。"
          fi
          cat "$RUNNER_TEMP/notes.txt"

      - name: バージョンを用意して審査に出す
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          VERSION: ${{ needs.upload.outputs.version }}
          BUILD_ID: ${{ steps.build.outputs.id }}
          RELEASE_TYPE: ${{ vars.ASC_RELEASE_TYPE || 'AFTER_APPROVAL' }}
        run: |
          python3 scripts/asc.py submit \
            --version "$VERSION" \
            --build-id "$BUILD_ID" \
            --notes-file "$RUNNER_TEMP/notes.txt" \
            --release-type "$RELEASE_TYPE"
          echo "審査に出しました。通れば配信が始まり、tag-release がタグを打ちます。"
